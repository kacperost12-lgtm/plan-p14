name: Aktualizacja planu

on:
  schedule:
    - cron: "15 3 * * *"     # codziennie ok. 4:15/5:15 czasu polskiego
    - cron: "0 22 * * 0"     # w niedzielę wieczorem, żeby od poniedziałku był nowy tydzień
  workflow_dispatch:          # przycisk "Run workflow" w zakładce Actions
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Poprzednio opublikowany plan: z niego zostają starsze tygodnie
      - name: Pobierz poprzedni plan
        run: |
          cp site/data.json seed.json
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data.json" -o previous.json \
            || cp seed.json previous.json

      - name: Pobierz plan z USOS
        id: scrape
        continue-on-error: true
        shell: pwsh
        run: ./scrape.ps1 -Building P-14 -OutFile site/data.json -WeeksBack 2 -WeeksAhead 20 -Previous previous.json,seed.json

      # USOS bywa w przerwie technicznej: wtedy zostaje ostatni opublikowany plan
      - name: Zachowaj poprzedni plan, jeśli USOS nie odpowiada
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::warning::USOS niedostępny, publikuję poprzedni plan"
          cp previous.json site/data.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
