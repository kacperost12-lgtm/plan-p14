name: Aktualizacja planu

on:
  schedule:
    - cron: "15 3 * * *"     # codziennie ok. 4:15/5:15 czasu polskiego
    - cron: "0 22 * * 0"     # w niedzielę wieczorem, żeby od poniedziałku był nowy tydzień
  workflow_dispatch:          # przycisk "Run workflow" w zakładce Actions
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Pobierz plan z USOS
        shell: pwsh
        run: ./scrape.ps1 -Building P-14 -OutFile site/data.json -Weeks 3

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
